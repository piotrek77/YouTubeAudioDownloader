name: Build Installer (Setup.exe)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build YouTubeAudioDownloader_Setup.exe
        shell: pwsh
        run: .\build-installer.ps1

      - name: Publish YouTubeAudioDownloader_Setup.exe to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: YouTube Audio Downloader (MP3) - Instalator
          body: |
            Pobierz i uruchom **`YouTubeAudioDownloader_Setup.exe`** poniżej (bez konieczności rozpakowywania archiwum ZIP).
          files: YouTubeAudioDownloader_Setup.exe
          prerelease: false
          make_latest: true
